name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luced-message
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          git clone -q --depth 1 https://github.com/dymokomi/luce-base.git
          python3 luce-base/tools/checkout_main.py luced-message luce
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-dejavu-core libx11-dev libxi-dev libxrandr-dev libvulkan-dev
      - name: Build released compilers
        run: |
          (cd luce-base && ./build.sh)
          (cd luce && LUCE_BASE_COMPILER=../luce-base/build/luce-base ./build.sh)
          echo "LUCE=$PWD/luce/build/luce" >> "$GITHUB_ENV"
          echo "LUCE_BASE=$PWD/luce-base/build/luce-base" >> "$GITHUB_ENV"
      - name: Headless tests
        working-directory: luced-message
        run: python3 tests/run.py --base "$LUCE_BASE" --luce "$LUCE"
